name: Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ---------------- Linux ----------------
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            clang \
            qtbase5-dev \
            qtbase5-dev-tools \
            libdcmtk-dev \
            libnsl-dev

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Release -S .

      # ---------------- macOS ----------------
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install qt@5 dcmtk

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5)" -DCMAKE_BUILD_TYPE=Release -S .

      # ---------------- Windows ----------------
      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'

      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
        shell: pwsh

      - name: Install DCMTK via vcpkg (Windows)
        if: runner.os == 'Windows'
        run: .\vcpkg\vcpkg.exe install dcmtk:x64-windows
        shell: pwsh

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE="$PWD\vcpkg\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DCMAKE_BUILD_TYPE=Release -S .
        shell: pwsh

      # ---------------- Build (all OSes) ----------------
      - name: Build
        run: cmake --build build --config Release -j

      # ---------------- Upload artifacts ----------------
      - name: Upload executable (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: imagisSRM-linux
          path: build/imagisSRM

      - name: Upload executable (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: imagisSRM-macos
          path: build/imagisSRM

      - name: Upload executable (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: imagisSRM-windows
          path: build/Release/imagisSRM.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries for release
        run: |
          mv artifacts/imagisSRM-linux/imagisSRM artifacts/imagisSRM-linux-x64
          mv artifacts/imagisSRM-macos/imagisSRM artifacts/imagisSRM-macos-x64
          mv artifacts/imagisSRM-windows/imagisSRM.exe artifacts/imagisSRM-windows-x64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/imagisSRM-linux-x64
            artifacts/imagisSRM-macos-x64
            artifacts/imagisSRM-windows-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
